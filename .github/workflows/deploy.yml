name: CI/CD to Hostinger

on:
  push:
    branches: [ main ]
  # Pull requests run the tests only (the deploy job below is limited to pushes
  # to main), so a broken change is caught while it is still a proposal.
  pull_request:
    branches: [ main ]

jobs:
  # A failing test must never reach the server. Every merge to main is a
  # production deploy, and the tests cover exactly the things that are
  # expensive to get wrong on a match day: standings, points, the auction
  # rules, cards, the captain fix, and who is allowed to change what.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Node 24 matches the Docker image. The code uses the built-in
      # node:sqlite module, which needs it.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy using Password SSH
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          DIRECTORY: ${{ secrets.DIRECTORY }}
        run: |
          # 'bash -s' as an explicit remote command, rather than a bare `ssh
          # host << EOF`, so this always runs as a plain non-interactive,
          # non-login bash reading the script from stdin — not whatever the
          # account's default login shell happens to be configured to do.
          sshpass -p "$PASSWORD" ssh -o StrictHostKeyChecking=no $USERNAME@$SERVER_IP 'bash -s' << EOF
            set -e

            cd "$DIRECTORY"

            # Remember what is running now, so a bad deploy can be undone.
            PREVIOUS=\$(git rev-parse HEAD)
            PORT=\$(grep -E '^PORT=' .env | cut -d= -f2)
            PORT=\${PORT:-3000}

            # A backup from the version that is still running, before anything
            # changes. A new version can migrate the database on its first
            # start; this is the copy to go back to if that ever goes wrong.
            # No backup, no deploy.
            #
            # < /dev/null matters: this whole script reaches the server on
            # standard input ('bash -s'), and docker compose exec reads standard
            # input — without it, the exec swallows the rest of the script and
            # the deploy "succeeds" having done nothing after the backup.
            echo "💾 Backing up before deploying..."
            if ! docker compose exec -T app npm run backup < /dev/null; then
              echo "❌ The backup failed, so nothing was deployed. Check that the app is running."
              exit 1
            fi

            echo "📦 Pulling latest code..."
            git pull origin main

            # docker compose, not \`docker build\` + \`docker run\`: the database
            # lives in the wegro-data named volume declared in
            # docker-compose.yml, not in the image or a container. \`up -d
            # --build\` rebuilds the image and recreates the container in
            # place — the volume is untouched, so this never loses data the
            # way a manual \`docker rm\` + fresh \`docker run\` (with no -v)
            # would for a stateful app.
            #
            # No --profile tls here: this server fronts the app with its own
            # nginx (see docs/DEPLOYMENT.md and deploy/nginx.conf.example),
            # so the bundled Caddy service is never started.
            echo "🔨 Building and starting..."
            docker compose up -d --build

            wait_healthy() {
              for i in \$(seq 1 20); do
                if curl -sf "http://127.0.0.1:\$PORT/healthz" > /dev/null; then
                  return 0
                fi
                sleep 3
              done
              return 1
            }

            echo "🩺 Waiting for health check on port \$PORT..."
            if wait_healthy; then
              echo "✅ Healthy"
              # Only now: until the new version is known good, the old image
              # is what a rollback would reuse.
              echo "🧹 Pruning old images..."
              docker image prune -f
            else
              echo "❌ The new version did not become healthy — recent logs:"
              docker compose logs app --tail 80

              # Put the previous version back rather than leave the site down.
              # A migration that fails is rolled back inside its own
              # transaction, so the database the old version finds is the one
              # it left. If anything looks wrong, the backup taken above is in
              # the wegro-backups volume.
              echo "⏪ Rolling back to \$PREVIOUS..."
              git reset --hard "\$PREVIOUS"
              docker compose up -d --build
              if wait_healthy; then
                echo "↩️  Rolled back. The site is running the previous version."
              else
                echo "🚨 The rollback did not come up either. Check the server now."
              fi
              exit 1
            fi
          EOF
