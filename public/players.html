<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Players — WeGro Tournaments</title>
    <meta name="description" content="Everyone who has played in a WeGro tournament: ratings, goals, saves and medals." />
    <meta property="og:title" content="WeGro Players" />
    <meta property="og:description" content="Ratings, goals, saves and medals for everyone who has played." />
    <meta property="og:image" content="{{PUBLIC_URL}}/assets/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/assets/favicon.png" type="image/png" sizes="256x256" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <meta name="theme-color" content="#03201c" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/public.css" />
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/players.css" />
  </head>
  <body>
    <header class="site-head">
      <div class="wrap site-head__bar">
        <a class="brand" href="/">
          <img src="/assets/wegro-logo-on-dark.svg" alt="WeGro" width="88" height="24" />
          <span class="brand__title">Tournaments</span>
        </a>
        <button class="menu-btn" type="button" aria-expanded="false" aria-controls="siteNav">
          <span class="menu-btn__icon" aria-hidden="true"></span><span>Menu</span>
        </button>
        <nav class="site-nav" id="siteNav" aria-label="Site">
          <a href="/">Tournaments</a>
          <a href="/players">Players</a>
          <a href="/hall-of-fame">Hall of Fame</a>
          <a class="site-nav__cta" href="/admin">Admin</a>
        </nav>
      </div>
    </header>

    <main class="wrap stack">
      <!-- The list -->
      <section id="listView" hidden>
        <div class="page-intro">
          <p class="eyebrow">WeGro Tournaments</p>
          <h1 class="page-intro__title">Players</h1>
          <p class="page-intro__sub" id="listSub">Everyone who has played, and how they did.</p>
        </div>

        <div class="players-tools">
          <input class="input" id="search" type="search" placeholder="Search by name" aria-label="Search players" />
          <div class="seg" id="posFilter" role="group" aria-label="Position">
            <button type="button" data-pos="" aria-pressed="true">All</button>
            <button type="button" data-pos="GK" aria-pressed="false">GK</button>
            <button type="button" data-pos="DEF" aria-pressed="false">DEF</button>
            <button type="button" data-pos="MID" aria-pressed="false">MID</button>
            <button type="button" data-pos="FWD" aria-pressed="false">FWD</button>
          </div>
          <select class="input" id="sort" aria-label="Sort by">
            <option value="rating">Highest rated</option>
            <option value="goals">Most goals</option>
            <option value="assists">Most assists</option>
            <option value="saves">Most saves</option>
            <option value="matches">Most matches</option>
            <option value="name">Name</option>
          </select>
        </div>

        <div class="pc-grid" id="grid"></div>
      </section>

      <!-- One player -->
      <section id="profileView" hidden></section>

      <div class="empty-state" id="loading"><div class="spinner"></div><p>Loading…</p></div>
      <div class="empty-state" id="problem" hidden>
        <h2 id="problemTitle">Something went wrong</h2>
        <p class="muted" id="problemText"></p>
        <a class="btn btn--primary" href="/players">All players</a>
      </div>
    </main>

    <footer class="site-foot">
      <div class="wrap spread">
        <span class="faint">WeGro Tournaments</span>
        <span class="foot-links">
          <a class="faint" href="/">Tournaments</a>
          <a class="faint" href="/hall-of-fame">Hall of Fame</a>
          <span class="faint">
            Developed by
            <a href="https://github.com/NitPaul" target="_blank" rel="noopener noreferrer" class="credit">NitPaul</a>
          </span>
        </span>
      </div>
    </footer>

    <script type="module" src="/js/players.js"></script>
  </body>
</html>
